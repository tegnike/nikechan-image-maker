name = "AIニケちゃん サムネイル素材 10分"
prompt = "10分ごとに、AIニケちゃんのVTuber向けYouTubeサムネイル用素材を1点だけ生成してください。完成サムネイルを毎回生成するのではなく、背景・「朝活」文字・前景アクセントを同じtheme_idのテーマキットとして3run連続で制作します。キャラクター素材は独立して継続生成します。\n\n固定パス:\n- 作業場所: /Users/your-name/WorkSpace/nikechan-image-maker\n- 参照画像A: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet.png\n- 参照画像B: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-piercing.png\n- 参照画像C: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-outer-piercing.png\n- 保存ルート: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker\n- 素材: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/assets/{characters,backgrounds,texts,decorations}/YYYY/MM/DD/\n- プロンプト記録: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/prompts/YYYY/MM/DD/\n- 索引: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/index.jsonl\n- 完成テーマ正本: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/theme-kits.json\n- 頭部アンカー正本: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/head-anchors.json\n- 透過処理: /Users/your-name/.codex/skills/.system/imagegen/scripts/remove_chroma_key.py\n- 旧完成画像: /Volumes/EXTERNAL_VOLUME/ニケ/imagegen（読み取り専用）\n\n必須手順:\n1. 最初に /Volumes/EXTERNAL_VOLUME が実際にマウントされ、保存ルートと必要な参照画像が利用できることを確認する。満たさない場合はローカルへ代替保存せず失敗終了する。\n\n2. Codex標準imagegenスキルを読み、内蔵image_genを使う。内蔵image_genは1runにつき1回だけ呼ぶ。失敗時は画像生成を再試行せず失敗終了する。\n\n3. index.jsonlの最終generation_slotを確認し、次の10スロットを循環する:\ntheme-a-background → theme-a-title → theme-a-decoration → theme-b-background → theme-b-title → theme-b-decoration → character → theme-c-background → theme-c-title → theme-c-decoration → theme-a-background。\n新スロットが索引にまだなければtheme-a-backgroundから始める。これにより人物10%、背景30%、文字30%、前景30%を保つ。\n\n4. 背景・文字・前景を独立したランダム素材として考えない。同じtheme-a／b／cの3スロットは一つのデザイン案件であり、同じtheme_id、テーマ仕様、実生成画像を引き継ぐ。\n- backgroundスロット: 新しいtheme_idを Europe/Warsaw日時＋英数字slugで作り、テーマ仕様を先に決めてから背景を生成する。\n- titleスロット: index.jsonlから同じグループの直前background行を取得し、その実背景PNGを内蔵image_genの参照画像として渡す。background行のtheme_idとテーマ仕様を一字一句引き継ぐ。\n- decorationスロット: 同じtheme_idの実背景PNGと実文字PNGを参照し、同じ世界観の前景アクセントを生成する。成功後に3素材をtheme-kits.jsonへ1テーマとして登録する。\n- 途中runが失敗した場合は索引へ成功行を追記しない。次runは同じスロットを再開する。\n- titleまたはdecorationで対応する直前素材が見つからなければ、新規テーマを捏造せず失敗終了する。\n\n5. テーマ仕様には次を必ず含め、background行のprompt記録とindexへ保存する:\n- theme_id\n- theme_name（人間が見て分かる短い名前）\n- category=\"朝活\"\n- mood（視聴前に感じてほしい感情）\n- palette（4〜5個の正確なHEX。背景、文字、前景ですべて同じ値を使う）\n- contrast_anchor（画面を締める暗色または強色）\n- shape_language（曲線、斜線、紙片、太枠など統一する形）\n- texture_language（ハーフトーン、紙、グロス、鉛筆など最大1〜2種）\n- title_treatment（字面、影、立体、傾き、字組み）\n- composition_zone（人物位置、文字位置、重なり方）\n- visual_family\nテーマは completed theme-kits直近6件をview_imageで比較し、最低でもmood、palette、shape_language、texture_languageのうち3軸を変える。単なる色替えは禁止する。\nvisual_familyは electric-broadcast、cozy-editorial、fresh-pop、retro-tv、soft-luxury、scrapbook-magazine、clean-tech、handmade-cafe などから選べるが固定順にはしない。\n\n6. テーマ品質の基準:\n- 「違う素材」を作ることより「背景・文字・前景を重ねた一枚が欲しくなること」を優先する。\n- AIニケちゃんの紫髪、青緑Tシャツ、ピンクの上着と調和または意図的に対比するpaletteを設計する。\n- パステルのみで画面全体を薄くしない。必ずcontrast_anchorを設ける。\n- プレゼン資料、企業Webバナー、汎用壁紙、素材シート、生成AIの細密イラストに見せない。\n- 160px幅の縮小表示でも人物、指定文字、テーマの順序が明確に読めるようにする。\n- 太陽、日の出、光線、黄色だけを朝らしさの既定表現にしない。sunファミリーはcompleted themes直近8件にあれば禁止する。\n\n7. backgroundスロット:\n- 参照画像は使わない。16:9横長。人物、文字、ロゴを入れない。\n- 後載せする大きな人物と文字のための余白を持つが、単なる淡色無地や薄い幾何図形だけにしない。\n- 共通palette、shape_language、texture_languageを使い、タイトル面、外周フレーム、視線誘導、人物側の抜けなど各要素に明確な役割を持たせる。\n- 環境画・風景画・完成した部屋は原則禁止。場所ではなく配信番組のグラフィックパッケージとして作る。\n- 「graphic design package for a VTuber livestream thumbnail, not a presentation slide or generic website banner」「no character, no readable text」を最終プロンプトへ含める。\n\n8. titleスロット:\n- 生成対象は正確な二文字「朝活」だけ。別の文字、数字、英語、ロゴを入れない。\n- 同じtheme_idの背景PNGをスタイル参照として内蔵image_genへ渡し、palette、shape_language、texture_language、title_treatmentを一致させる。\n- 背景と無関係な汎用ステッカーにしない。毎回の「太字＋白縁＋黒縁＋色縁」の多重アウトラインを禁止する。輪郭は原則1系統、必要でも2系統まで。\n- 書体変更だけでなく、二文字の大小差、重なり、分割、傾き、ベースライン、字間をテーマとして設計する。\n- 1画像につきロゴ1点だけ。完全に均一な #00ff00 背景、影・床・反射なし、周囲に余白、ロゴ内に #00ff00 を使わない、と明記する。\n- 指定文字の欠落、重複、誤字、別字、判読不能、指定外文字があれば採用せず失敗終了する。\n\n9. decorationスロット:\n- 同じtheme_idの背景PNGと文字PNGをスタイル参照として渡す。\n- 画面外周、下帯、コーナー、文字後方の台座など、背景と文字を一体化する前景アクセントを1点だけ生成する。小物アイコンの単品をランダム生成しない。\n- 人物の顔と「朝活」を覆わない大きな空き領域を設ける。\n- palette、shape_language、texture_languageを一致させる。文字、数字、ロゴは禁止。\n- 完全に均一な #00ff00 背景、影・床・反射なし、周囲に余白、要素内に #00ff00 を使わない、と明記する。\n\n10. characterスロット:\n- 参照画像はA→B→C→Aの順で、直近character行のreference_slotの次を1枚だけ選び、view_imageで確認して内蔵image_genへ渡す。\n- AIニケちゃん本人の再利用可能な単独カットを1人・1描写だけ生成する。胸上、腰上、膝上、全身、左右向き、表情、手のポーズを履歴と変える。\n- 背景、家具、フレーム、吹き出し、小物、複製、反射、ポスター、完成サムネイル構図を入れない。\n- 次の固定文言を最終プロンプトへ一字一句含める。\n女の子の特徴を以下に示す。\n- 金色のヘアピンは「AI」という文字の形をしています。\n- 黒いシュシュを使って高めの位置でポニーテールをまとめている。\n- Tシャツの胸の部分には、「AITuber」という文字が書かれている。\n- ジーンズのショートパンツを履いている。\n- 瞳は淡い琥珀色。\n- 数種類の小さなピアスを両耳に付けている。\n- 完全に均一な #00ff00 クロマキー背景、影・床・反射なし、被写体の周囲に余白、被写体内に #00ff00 を使わない、と明記する。\n\n11. character、title、decorationは、生成元を作業場所/tmp/imagegen/へコピーし、remove_chroma_key.pyを --auto-key border --soft-matte --transparent-threshold 12 --opaque-threshold 220 --despill で1回実行する。alpha channel、透明な四隅、欠損なし、緑縁なしを確認する。細い緑縁だけなら --edge-contract 1 を加えた透過処理だけを1回再実行してよい。欠損時は採用しない。\n\n12. characterでは透過処理後PNGをview_imageで確認し、頭蓋・前髪・側頭部の髪を含む主な頭部領域（首、手、長いポニーテールは除外）の中心と外接矩形を決める。centerX、centerY、width、heightを元PNG全体に対する0〜1でhead-anchors.jsonへ原子的に保存する。sourceWidth、sourceHeight、method=\"manual-reviewed\"、confidenceも記録する。失敗したcharacterは採用しない。\n\n13. Europe/Warsaw日時のbasenameでPNGをカテゴリ別素材フォルダへ保存し、対応する.prompt.mdを保存する。prompt記録にはasset_type、generation_slot、theme_id、テーマ仕様、最終プロンプト全文、参照画像、透過処理、dimensions、alpha有無、sha256、head_anchorを残す。\n\n14. PNGとprompt記録を確認してからindex.jsonlへcreated_at、asset_type、generation_slot、asset、prompt、theme_id、theme_name、category、mood、palette、contrast_anchor、shape_language、texture_language、title_treatment、composition_zone、visual_family、text_verbatim、width、height、has_alpha、sha256、reference_slot、reference_image、head_anchor、tagsを1行JSONで追記する。該当しない値はnull。assetとpromptは保存ルートからの相対パスにする。\n\n15. decoration成功後、同じtheme_idのbackground、title、decorationが存在しsha256と画像内容を確認してからtheme-kits.jsonへid、name、category、concept、palette、shapeLanguage、backgroundAssetPath、titleAssetPath、decorationAssetPaths、createdAtを追加する。既存テーマを保持し、一時ファイルからrenameして原子的に更新する。3素材を簡易合成したpreviewも作りview_imageで確認し、色・形・質感が一体に見えない場合は公開せず失敗通知する。\n\n16. 1runで内蔵image_genが生成・保存する素材は1点だけ。theme previewは既存3素材の機械的合成なので生成点数に含めない。プロジェクトJSONやexport PNGは作らない。旧 /Volumes/EXTERNAL_VOLUME/ニケ/imagegen は読み取り専用とする。\n\n17. automation memoryは創作判断や重複回避に使わない。履歴と生成判断の正本はindex.jsonl、prompt記録、theme-kits.jsonとする。\n\n18. 成功時の最終出力はDONT_NOTIFYのみ。失敗時だけ失敗箇所、保持した成果物、再開点を日本語で簡潔に通知する。"
