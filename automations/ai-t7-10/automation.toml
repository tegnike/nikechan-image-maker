name = "AIニケちゃん サムネイル素材 10分"
prompt = "10分ごとに、AIニケちゃんのVTuber向けYouTubeサムネイル用「分離素材」を1点だけ生成し、ローカル合成アプリの素材ライブラリへ追加してください。完成サムネイルは生成しません。\n\n固定パス:\n- 作業場所: /Users/your-name/WorkSpace/nikechan-image-maker\n- 参照画像A: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet.png\n- 参照画像B: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-piercing.png\n- 参照画像C: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-outer-piercing.png\n- 保存ルート: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker\n- 素材: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/assets/{characters,backgrounds,texts,decorations}/YYYY/MM/DD/\n- プロンプト記録: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/prompts/YYYY/MM/DD/\n- 索引: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/index.jsonl\n- 頭部アンカー正本: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/head-anchors.json\n- 透過処理: /Users/your-name/.codex/skills/.system/imagegen/scripts/remove_chroma_key.py\n- 旧完成画像: /Volumes/EXTERNAL_VOLUME/ニケ/imagegen（読み取り専用。変更・削除・追記しない）\n\n必須手順:\n1. 最初に /Volumes/EXTERNAL_VOLUME が実際にマウントされ、保存ルートと今回必要な参照画像が利用できることを確認する。満たさない場合はローカルへ代替保存せず失敗終了する。\n2. Codex標準imagegenスキルを読み、内蔵image_genを使う。内蔵image_genは1runにつき1回だけ呼ぶ。画像生成が失敗した場合は再試行せず失敗終了する。\n3. index.jsonlの最終行のgeneration_slotを確認し、次の10スロットを循環して1カテゴリだけ選ぶ: background-1 → text-1 → decoration-1 → background-2 → text-2 → decoration-2 → character → background-3 → text-3 → decoration-3 → background-1。asset_typeは各スロット名のbackground、text、decoration、character部分に対応させる。索引内にこの新しい10スロットの行がまだない場合はbackground-1から始める。これにより人物10%、背景30%、文字30%、小物30%とする。\n4. index.jsonlの直近30件と、今回カテゴリの直近20件を確認する。textとdecorationでは直近6件の採用PNGもview_imageで見比べる。固定テンプレート順ではなく、今回専用concept_signatureを先に決める。textとdecorationはさらに次の4軸を英数字slugで決め、履歴へ記録する。\n   - motif_family: none、ribbon、steam、mug、toast、leaf、bird、cloud、window、check、arrow、sparkle、speech、tapeなどの主モチーフ。sun、sunrise、sunburst、rays、halo、dawn-disk、semicircle-sunはすべて同一のsunファミリーとして扱う。\n   - shape_family: horizontal、vertical、stacked、split、tilted、arch、circle、underline、corner、bracket、plate、railなどの全体形状。\n   - palette_family: 主色・補助色・外縁色の組み合わせ。coral-ivory-deep-tealは表記揺れも同じファミリーとして扱う。\n   - style_family: block-outline、brush、paper-cut、sticker、flat-pop、retro-print、soft-rounded、inkなどの表現方式。\n   - 同カテゴリ直近5件の各素材に対し、4軸のうち最低3軸を変える。名前だけ変えて同じ見た目にすることは禁止する。\n   - sunファミリーは同カテゴリ直近8件に1件でもあれば使用禁止。朝らしさを太陽、日の出、光線、黄橙色だけで表現しない。\n   - textとdecorationの直近10件中3件以上が具象的な朝モチーフなら、次はmotif_family=noneの抽象形状にする。\n5. characterカテゴリ:\n   - 参照画像はA→B→C→Aの順で、直近character行のreference_slotの次を1枚だけ選ぶ。view_imageで確認し、内蔵image_genへreference imageとして渡す。\n   - AIニケちゃん本人の再利用可能な単独カットを1人・1描写だけ生成する。胸上、腰上、膝上、全身、左右向き、視線、表情、手のポーズを履歴と変える。\n   - 背景・家具・フレーム・吹き出し・小物・人物の複製・反射・ポスター・完成サムネイル構図を入れない。\n   - 次の固定文言を最終プロンプトへ一字一句そのまま含める。\n女の子の特徴を以下に示す。\n- 金色のヘアピンは「AI」という文字の形をしています。\n- 黒いシュシュを使って高めの位置でポニーテールをまとめている。\n- Tシャツの胸の部分には、「AITuber」という文字が書かれている。\n- ジーンズのショートパンツを履いている。\n- 瞳は淡い琥珀色。\n- 数種類の小さなピアスを両耳に付けている。\n   - 完全に均一な #00ff00 クロマキー背景、影・床・反射なし、被写体の周囲に余白、被写体内に #00ff00 を使わない、と明記する。\n   - 透過処理後の最終PNGをview_imageで確認し、顔のパーツ一点ではなく、頭蓋・前髪・側頭部の髪を含む主な頭部領域（首、手、長く伸びたポニーテール部分は除外）の中心と外接矩形を決める。centerX、centerY、width、heightを元PNG全体に対する0〜1の正規化値で記録する。\n6. backgroundカテゴリ:\n   - 参照画像は使わない。16:9横長。人物、文字、ロゴ、前景フレームを一切入れない。\n   - 背景の主目的は場所を説明することではなく、後から置く大きな人物と大きな文字を読みやすく支えることとする。原則として環境画・風景画・部屋の完成イラストを生成しない。\n   - style_familyとして flat-color、soft-gradient、large-geometric、sparse-pattern、minimal-scene のいずれかを記録する。直近10件のbackgroundでminimal-sceneは最大1件とし、残り9件以上は場所を持たないグラフィック背景にする。flat-color／soft-gradientを約40%、large-geometricを約30%、sparse-patternを約20%、minimal-sceneを約10%の目安で補充する。\n   - flat-color／soft-gradient: 最大3色の単色、二色面、または穏やかなグラデーションだけで構成する。物体、地平線、床、壁、窓、家具を描かない。\n   - large-geometric: 円弧、太い帯、斜め分割、波形、スカラップなど最大4個の大きな図形だけを使う。細かな装飾や奥行きを作らない。\n   - sparse-pattern: ドット、星、チェックなど1種類だけを、粗く大きく低密度に配置する。細かな反復模様、素材感、描き込みは禁止する。\n   - minimal-scene: 青空、強く単純化した壁面、強くぼかした室内のいずれかに限定する。名前の付く場所、建築物、街並み、駅、カフェ、屋上、港、公園、和室、遠近感の強い構図、写実的な光景は禁止する。物体は0〜1点まで。\n   - 最終プロンプトに「graphic design background, not an environmental or scenic illustration」「no readable location, no perspective depth, no detailed lighting」を明記する。『polished anime background art』『highly detailed environment』など、完成背景美術を促す表現を使わない。\n   - 朝らしさは淡い配色で表現し、太陽、日の出、光線、黄橙色、朝の風景を既定パターンにしない。朝の意味付けは後から重ねる文字・小物レイヤーを優先する。\n   - composition_zoneとして文字向け余白と人物向け余白の位置を最終プロンプトと記録へ明記する。160px幅へ縮小したとき、背景単体より後載せする人物と文字が必ず目立つ密度にする。\n7. textカテゴリ:\n   - 参照画像は使わない。\n   - 生成対象の文字は「朝活」だけに固定する。基本は正確な二文字「朝活」を一枚で生成する。分割バリエーションとして「朝」単体と「活」単体を別runで1点ずつ生成してもよいが、それ以外の語句・文字・数字は生成しない。採用する正確な表記を最終プロンプトへ引用符付きで一字一句記載する。\n   - 1画像につき文字素材1点だけ。縮小しても読める太さを保ちつつ、書体、字組み、主色、縁取り方式を履歴から大きく変える。装飾は任意で最大1モチーフとし、細かな描写や素材シート化は禁止する。\n   - 直前のtextがmotif_family=none以外なら、今回は必ずmotif_family=noneにして文字造形だけで成立させる。直前がnoneなら、直近8件にないモチーフを1つだけ使ってよい。\n   - 指定文字の欠落、重複、誤字、別字、崩れて判読不能な字形、指定外の文字・数字・ロゴがある場合は採用しない。\n   - 完全に均一な #00ff00 クロマキー背景、背景への影・床・反射なし、素材の周囲に余白、素材内に #00ff00 を使わない、と明記する。\n8. decorationカテゴリ:\n   - 参照画像は使わない。\n   - 1画像につき独立した1要素だけを生成する。フレーム、下線、括弧、コーナー、テープ、抽象図形、湯気、マグ、トースト、葉、鳥、雲、窓などから履歴と異なる機能・形を選ぶ。中央や文字用領域は空にし、文字・数字・ロゴは描かない。\n   - 「朝の素材だから太陽を添える」という既定パターンを禁止する。具象モチーフが過多なら、アイコンなしの抽象的な線・面・余白構成を優先する。\n   - 完全に均一な #00ff00 クロマキー背景、影・床・反射なし、要素の周囲に余白、要素内に #00ff00 を使わない、と明記する。\n   - 細かな小物の詰め合わせ、複数素材シート、過剰な装飾を禁止する。\n9. character、text、decorationは、生成元を作業場所/tmp/imagegen/へコピーし、指定のremove_chroma_key.pyを --auto-key border --soft-matte --transparent-threshold 12 --opaque-threshold 220 --despill で1回実行する。alpha channel、透明な四隅、被写体の欠損なし、目立つ緑縁なしを確認する。細い緑縁だけが残る場合は画像再生成ではなく --edge-contract 1 を加えた透過処理だけを1回再実行してよい。被写体が欠損する場合は採用・索引追記せず失敗終了する。characterでは保存する最終PNGを基準に頭部アンカーを決め、head-anchors.jsonのanchorsへ素材相対パス（characters/YYYY/MM/DD/basename.png）をキーとしてcenterX、centerY、width、height、sourceWidth、sourceHeight、method=\"manual-reviewed\"、confidenceを保存する。既存項目を保持したまま一時ファイルからのrenameで原子的に更新し、この更新に失敗したcharacterは採用・索引追記しない。\n10. Europe/Warsaw日時のbasename YYYYMMDD-HHMMSS-短い英数字slugでPNGをカテゴリ別素材フォルダへ保存し、対応する.prompt.mdをプロンプト記録へ保存する。prompt記録にはasset_type、generation_slot、concept_signature、motif_family、shape_family、palette_family、style_family、text_verbatim、head_anchor、最終プロンプト全文、参照画像、透過処理、dimensions、alpha有無、sha256を残す。text_verbatimはtext以外ではnullにする。\n11. PNGとprompt記録を確認してからindex.jsonlへcreated_at、asset_type、generation_slot、asset、prompt、concept_signature、motif_family、shape_family、palette_family、style_family、text_verbatim、head_anchor、width、height、has_alpha、sha256、reference_slot、reference_image、composition_zone、tagsを1行JSONで追記する。該当しない値はnullにする。assetとpromptは保存ルートからの相対パスにする。\n12. 1runで生成・保存する素材は1点だけ。完成サムネイル、複数素材の詰め合わせ、合成済み画像、プロジェクトJSON、export PNGは作らない。旧 /Volumes/EXTERNAL_VOLUME/ニケ/imagegen は読み取り専用とする。\n13. automation memoryは創作判断や重複回避の根拠に使わない。各runの成功・失敗と保存先だけを短く記録してよいが、履歴と生成判断の正本は新しいindex.jsonlとprompt記録だけとする。\n14. 成功時の最終出力はDONT_NOTIFYのみ。失敗時だけ、失敗箇所、保持した成果物、再開点を日本語で簡潔に通知する。"
