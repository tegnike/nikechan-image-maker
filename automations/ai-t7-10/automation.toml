prompt = "10分ごとに、AIニケちゃんのVTuber向けYouTubeサムネイル用テーマセットまたはキャラクター素材を生成してください。背景と「朝活」文字は必ず同じtheme_idの2点セットとして運用し、個別の背景・文字・小物は生成しません。\n\n固定パス:\n- 作業場所: /Users/your-name/WorkSpace/nikechan-image-maker\n- 参照画像A: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet.png\n- 参照画像B: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-piercing.png\n- 参照画像C: /Users/your-name/WorkSpace/nikechan-image-maker/references/nikechan-model-sheet-outer-piercing.png\n- 保存ルート: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker\n- 素材: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/assets/{characters,backgrounds,texts}/YYYY/MM/DD/\n- プロンプト記録: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/prompts/YYYY/MM/DD/\n- 索引: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/index.jsonl\n- 完成テーマ正本: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/theme-kits.json\n- 頭部アンカー正本: /Volumes/EXTERNAL_VOLUME/ニケ/thumbnail-maker/head-anchors.json\n- 透過処理: /Users/your-name/.codex/skills/.system/imagegen/scripts/remove_chroma_key.py\n- 旧完成画像: /Volumes/EXTERNAL_VOLUME/ニケ/imagegen（読み取り専用）\n\n必須手順:\n1. 最初に /Volumes/EXTERNAL_VOLUME が実際にマウントされ、保存ルートと必要な参照画像が利用できることを確認する。満たさない場合はローカルへ代替保存せず失敗終了する。\n\n2. Codex標準imagegenスキルを読み、内蔵image_genを使う。内蔵image_genは1runにつき1回だけ呼ぶ。失敗時は画像生成を再試行せず失敗終了する。\n\n3. index.jsonlの最終generation_slotを確認し、次の20スロットを循環する:\ntheme-a-background → theme-a-title → theme-b-background → theme-b-title → theme-c-background → theme-c-title → theme-d-background → theme-d-title → character-1 → theme-e-background → theme-e-title → theme-f-background → theme-f-title → theme-g-background → theme-g-title → theme-h-background → theme-h-title → theme-i-background → theme-i-title → character-2 → theme-a-background。\n新スロットが索引になければtheme-a-backgroundから始める。20runでテーマ9セットとキャラクター2点を作り、キャラクター比率を10%とする。\n\n4. 背景と文字を独立素材として考えない。同じtheme-a〜iのbackgroundとtitleは一つのデザイン案件であり、同じtheme_id、テーマ仕様、実生成画像を引き継ぐ。\n- background: 新しいtheme_idをEurope/Warsaw日時＋英数字slugで作り、テーマ仕様を決めて背景を生成する。\n- title: index.jsonlから同じグループの直前background行を取得し、その実背景PNGを内蔵image_genの参照画像として渡す。background行のtheme_idとテーマ仕様を一字一句引き継ぐ。\n- title成功後、背景と文字の簡易合成をview_imageで確認し、合格した2素材をtheme-kits.jsonへ1テーマとして登録する。\n- 途中runが失敗した場合は索引へ成功行を追記せず、次runで同じスロットを再開する。\n- titleで対応するbackgroundが見つからなければ、新しいテーマを捏造せず失敗終了する。\n- decorations、小物、前景フレームは生成しない。外周枠、帯、コーナー、文字台座が必要ならbackgroundのデザインへ統合する。\n\n5. テーマ仕様には次を必ず含め、background行のprompt記録とindexへ保存する:\ntheme_id、theme_name、category=\"朝活\"、mood、palette（4〜5個の正確なHEX）、contrast_anchor、shape_language、texture_language（最大2種）、title_treatment、composition_zone、visual_family。\ncompleted theme-kits直近6件をview_imageで比較し、mood、palette、shape_language、texture_languageのうち最低3軸を変える。単なる色替えは禁止する。\nvisual_familyはelectric-broadcast、cozy-editorial、fresh-pop、retro-tv、soft-luxury、scrapbook-magazine、clean-tech、handmade-cafeなどから選べるが固定順にしない。\n\n6. テーマ品質:\n- 「違う素材」より「背景と文字を重ねた一枚が欲しくなること」を優先する。\n- AIニケちゃんの紫髪、青緑Tシャツ、ピンクの上着と調和または意図的に対比するpaletteを設計する。\n- パステルだけで全体を薄くせず、必ずcontrast_anchorを設ける。\n- プレゼン資料、企業Webバナー、汎用壁紙、素材シート、生成AIの細密イラストに見せない。\n- 160px幅でも人物、指定文字、テーマの順序が明確に読めるようにする。\n- 太陽、日の出、光線、黄色だけを朝らしさの既定表現にしない。sunファミリーはcompleted themes直近8件にあれば禁止する。\n\n7. background:\n- 参照画像は使わない。16:9横長。人物、文字、ロゴを入れない。\n- 後載せする人物と文字の余白を持つが、淡色無地や薄い幾何図形だけにしない。\n- 共通palette、shape_language、texture_languageを使い、タイトル面、外周フレーム、視線誘導、人物側の抜けなど各要素に役割を持たせる。\n- 小物レイヤーを後から足さなくても成立するよう、必要な枠、帯、コーナー、文字台座は背景へ統合する。\n- 環境画・風景画・完成した部屋は原則禁止。場所ではなく配信番組のグラフィックパッケージとして作る。\n- 「graphic design package for a VTuber livestream thumbnail, not a presentation slide or generic website banner」「no character, no readable text」を最終プロンプトへ含める。\n\n8. title:\n- 生成対象は正確な二文字「朝活」だけ。別の文字、数字、英語、ロゴを入れない。\n- 同じtheme_idの実背景PNGをスタイル参照として内蔵image_genへ渡し、palette、shape_language、texture_language、title_treatmentを一致させる。\n- 背景と無関係な汎用ステッカーにしない。「太字＋白縁＋黒縁＋色縁」の多重アウトラインを禁止する。輪郭は原則1系統、必要でも2系統まで。\n- 書体だけでなく、二文字の大小差、重なり、分割、傾き、ベースライン、字間をテーマとして設計する。\n- 1画像につきロゴ1点だけ。完全に均一な #00ff00 背景、影・床・反射なし、周囲に余白、ロゴ内に #00ff00 を使わない、と明記する。\n- 指定文字の欠落、重複、誤字、別字、判読不能、指定外文字があれば採用せず失敗終了する。\n\n9. character-1／character-2:\n- 参照画像はA→B→C→Aの順で、直近character行のreference_slotの次を1枚だけ選び、view_imageで確認して内蔵image_genへ渡す。\n- AIニケちゃん本人の再利用可能な単独カットを1人・1描写だけ生成する。胸上、腰上、膝上、全身、左右向き、表情、手のポーズを履歴と変える。\n- 背景、家具、フレーム、吹き出し、小物、複製、反射、ポスター、完成サムネイル構図を入れない。\n- 次の固定文言を最終プロンプトへ一字一句含める。\n女の子の特徴を以下に示す。\n- 金色のヘアピンは「AI」という文字の形をしています。\n- 黒いシュシュを使って高めの位置でポニーテールをまとめている。\n- Tシャツの胸の部分には、「AITuber」という文字が書かれている。\n- ジーンズのショートパンツを履いている。\n- 瞳は淡い琥珀色。\n- 数種類の小さなピアスを両耳に付けている。\n- 完全に均一な #00ff00 クロマキー背景、影・床・反射なし、被写体の周囲に余白、被写体内に #00ff00 を使わない、と明記する。\n\n10. characterとtitleは、生成元を作業場所/tmp/imagegen/へコピーし、remove_chroma_key.pyを --auto-key border --soft-matte --transparent-threshold 12 --opaque-threshold 220 --despill で1回実行する。alpha channel、透明な四隅、欠損なし、緑縁なしを確認する。細い緑縁だけなら --edge-contract 1 を加えた透過処理だけを1回再実行してよい。欠損時は採用しない。\n\n11. characterでは透過処理後PNGをview_imageで確認し、頭蓋・前髪・側頭部の髪を含む主な頭部領域（首、手、長いポニーテールは除外）の中心と外接矩形を決める。centerX、centerY、width、heightを元PNG全体に対する0〜1でhead-anchors.jsonへ原子的に保存する。sourceWidth、sourceHeight、method=\"manual-reviewed\"、confidenceも記録する。失敗したcharacterは採用しない。\n\n12. Europe/Warsaw日時のbasenameでPNGをカテゴリ別素材フォルダへ保存し、対応する.prompt.mdを保存する。prompt記録にはasset_type、generation_slot、theme_id、テーマ仕様、最終プロンプト全文、参照画像、透過処理、dimensions、alpha有無、sha256、head_anchorを残す。\n\n13. PNGとprompt記録を確認してからindex.jsonlへcreated_at、asset_type、generation_slot、asset、prompt、theme_id、theme_name、category、mood、palette、contrast_anchor、shape_language、texture_language、title_treatment、composition_zone、visual_family、text_verbatim、width、height、has_alpha、sha256、reference_slot、reference_image、head_anchor、tagsを1行JSONで追記する。該当しない値はnull。assetとpromptは保存ルートからの相対パスにする。\n\n14. title成功後、同じtheme_idのbackgroundとtitleが存在しsha256と画像内容を確認してからtheme-kits.jsonへid、name、category、concept、palette、shapeLanguage、backgroundAssetPath、titleAssetPath、createdAtを追加する。decorationAssetPathsは書かない。既存テーマを保持し、一時ファイルからrenameして原子的に更新する。2素材を簡易合成したpreviewをview_imageで確認し、色・形・質感が一体に見えない場合は公開せず失敗通知する。\n\n15. 1runで生成・保存する素材は1点だけ。theme previewは既存2素材の機械的合成なので生成点数に含めない。小物、前景、個別背景、個別文字、プロジェクトJSON、export PNGは作らない。旧 /Volumes/EXTERNAL_VOLUME/ニケ/imagegen は読み取り専用とする。\n\n16. automation memoryは創作判断や重複回避に使わない。履歴と生成判断の正本はindex.jsonl、prompt記録、theme-kits.jsonとする。\n\n17. 成功時の最終出力はDONT_NOTIFYのみ。失敗時だけ失敗箇所、保持した成果物、再開点を日本語で簡潔に通知する。"
